name: cooljeanius/autoconf-archive
run-name: "cooljeanius/autoconf-archive ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  push:
    branches:
    - "**/*"
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v3.5.0
      with:
        fetch-depth: 50000
    - run: sudo apt-get update
    - run: sudo apt-get -y install gnulib python3 texlive texinfo tidy
    - run: "./bootstrap.sh"
    - run: "./configure"
    - run: make PYTHON=python3 -j$(nproc) maintainer-all all
    - run: make distcheck
    - run: make web-manual
    - run: "./fix-website.sh"
